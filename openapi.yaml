openapi: 3.0.3
info:
  title: API de Accesos - Estacionamiento
  version: 1.0.0
servers:
  - url: /v1
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
security:
  - ApiKeyAuth: []
paths:
  /tickets:
    post:
      summary: Emite un ticket de acceso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                patente: { type: string }
                sector_id: { type: string }
      responses:
        '201':
          description: Ticket emitido
        '400':
          description: Sector sin plazas libres
        '503':
          description: Servicio de sensores no disponible